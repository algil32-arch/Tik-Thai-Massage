<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tik Thai Massage</title>
    <style>
      :root {
        --primary: #7b2cbf;
        --surface: #f8f5ff;
        --text: #222;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: var(--text);
        background: #fff;
        line-height: 1.5;
      }

      header {
        background: linear-gradient(135deg, var(--primary), #9d4edd);
        color: #fff;
        padding: 3rem 1.5rem;
        text-align: center;
      }

      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 2rem 1.5rem 3rem;
      }

      section {
        background: var(--surface);
        border-radius: 10px;
        padding: 1.25rem;
        margin-bottom: 1rem;
      }

      h1,
      h2 {
        margin-top: 0;
      }

      ul {
        padding-left: 1.25rem;
      }

      .cta {
        display: inline-block;
        margin-top: 0.75rem;
        padding: 0.65rem 1rem;
        border-radius: 8px;
        text-decoration: none;
        background: var(--primary);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tik Thai Massage</h1>
      <p>Traditional Thai massage for relaxation, recovery, and balance.</p>
    </header>

    <main>
      <section>
        <h2>Our Services</h2>
        <ul>
          <li>Traditional Thai Massage</li>
          <li>Deep Tissue Massage</li>
          <li>Foot Reflexology</li>
        </ul>
      </section>

      <section>
        <h2>Opening Hours</h2>
        <p>Monday - Sunday: 10:00 AM - 8:00 PM</p>
      </section>

      <section>
        <h2>Book an Appointment</h2>
        <p>Please call our front desk to reserve your session.</p>
      </section>
    </main>
  </body>
  </html>
